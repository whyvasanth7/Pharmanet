<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Doctor Login – Pharmanet</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      background-color: #f8f9fa;
    }

    .parallax {
      background-image: url("{{ url_for('static', filename='pharmacy.jpg') }}");
      min-height: 100vh;
      background-attachment: fixed;
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
    }

    .overlay {
      background-color: rgba(255, 255, 255, 0.78);
      min-height: 100vh;
    }

    .navbar {
      background-color: #fff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .navbar-brand {
      display: flex;
      align-items: center;
      font-weight: 600;
      font-size: 1.4rem;
      color: #4a5c8a;
      text-decoration: none;
    }

    .navbar-brand span {
      font-style: italic;
      transition: color 0.3s ease;
    }

    .navbar-brand:hover span {
      color: #3b4f78;
    }

    .btn-primary {
      background-color: #4a5c8a;
      border: none;
    }

    .btn-primary:hover {
      background-color: #3a4d75;
    }
  </style>
</head>
<body>

<section class="parallax">
  <div class="overlay">

    <!-- Navbar -->
    <header class="navbar navbar-light">
      <div class="container d-flex justify-content-between align-items-center py-2 position-relative">
        <a href="/" class="navbar-brand">
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="#4a5c8a" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="2"/>
            <path d="M12 2v5M12 17v5M4.22 4.22l3.54 3.54M16.24 16.24l3.54 3.54M2 12h5M17 12h5M4.22 19.78l3.54-3.54M16.24 7.76l3.54-3.54"
                  stroke="#4a5c8a" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span>Pharmanet</span>
        </a>

        <button class="btn btn-outline-secondary btn-sm" onclick="window.location.href='/login'">
          User Login
        </button>
      </div>
    </header>

    <!-- Doctor Login Form -->
    <div class="container d-flex justify-content-center align-items-center" style="min-height: calc(100vh - 80px);">
      <div class="col-md-5 bg-white p-4 rounded shadow-sm">
        <h2 class="text-center mb-4">Doctor Login</h2>

        <form method="POST" action="{{ url_for('doctor_login') }}">
          <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <input type="email" class="form-control" id="email" name="email" required>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password" required>
          </div>

          <button type="submit" class="btn btn-primary w-100 mt-2">Login as Doctor</button>
        </form>
      </div>
    </div>

  </div>
</section>

<footer class="text-center py-3 bg-white border-top">
  © 2025 Pharmanet. All rights reserved.
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
