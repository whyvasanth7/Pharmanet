<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pharmanet – Create Account</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      background-color: #f8f9fa;
    }

    /* ✅ SAME BACKGROUND AS HOMEPAGE */
    .parallax {
      background-image: url("{{ url_for('static', filename='pharmacy.jpg') }}");
      min-height: 100vh;
      background-attachment: fixed;
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
    }

    .overlay {
      background-color: rgba(255, 255, 255, 0.8);
      min-height: 100vh;
      padding-bottom: 50px;
    }

    /* Navbar */
    .navbar {
      background-color: #fff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      z-index: 10;
      position: sticky;
      top: 0;
    }

    .navbar-brand {
      display: flex;
      align-items: center;
      font-weight: 600;
      font-size: 1.4rem;
      color: #4a5c8a;
      text-decoration: none;
    }

    .navbar-brand span {
      font-style: italic;
      transition: color 0.3s ease;
    }

    .navbar-brand:hover span {
      color: #3b4f78;
    }

    .btn-primary {
      background-color: #4a5c8a;
      border: none;
    }

    .btn-primary:hover {
      background-color: #3a4d75;
    }

    .form-container {
      max-width: 500px;
      margin: 0 auto;
      padding-top: 80px;
    }

    footer {
      background: #fff;
      color: #777;
      text-align: center;
      padding: 10px;
      border-top: 1px solid #eee;
      margin-top: 60px;
    }
  </style>
</head>

<body>

  <section class="parallax">
    <div class="overlay">

      <!-- ✅ NAVBAR WITH LOGO FIXED TO LEFT -->
      <header class="navbar navbar-light">
        <div class="container-fluid d-flex align-items-center py-2 px-4">
          <a href="/" class="navbar-brand me-auto">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="#4a5c8a" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="2"/>
              <path d="M12 2v5M12 17v5M4.22 4.22l3.54 3.54M16.24 16.24l3.54 3.54M2 12h5M17 12h5M4.22 19.78l3.54-3.54M16.24 7.76l3.54-3.54"
                    stroke="#4a5c8a" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <span>Pharmanet</span>
          </a>
        </div>
      </header>

      <!-- ✅ CREATE ACCOUNT FORM -->
      <div class="container form-container">
        <h2 class="text-center mb-4">Create Account</h2>

        <form method="POST" action="/create-account">
          
          <div class="mb-3">
            <label class="form-label">First Name</label>
            <input type="text" class="form-control" name="first_name" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Last Name</label>
            <input type="text" class="form-control" name="last_name" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Email address</label>
            <input type="email" class="form-control" name="email" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Phone Number</label>
            <input type="text" class="form-control" name="phone" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Address</label>
            <input type="text" class="form-control" name="address" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" name="password" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Confirm Password</label>
            <input type="password" class="form-control" name="confirm_password" required>
          </div>

          <button type="submit" class="btn btn-primary w-100">
            Create Account
          </button>
        </form>

        <!-- ✅ LOGIN LINK RESTORED -->
        <p class="text-center mt-3">
          Already have an account?
          <a href="/login">Login here</a>
        </p>
      </div>

      <footer>
        © 2025 Pharmanet. All rights reserved.
      </footer>

    </div>
  </section>

</body>
</html>
